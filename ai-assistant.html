<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Yordamchi — SAVEONE</title>
<link rel="stylesheet" href="style.css">
<style>
body { height:100vh; display:flex; flex-direction:column; overflow:hidden; }
.orb { position:fixed; }

.chat-wrap { display:flex; flex-direction:column; flex:1; overflow:hidden; padding-top:64px; }

.msgs {
  flex:1; overflow-y:auto; padding:1.75rem 2rem;
  display:flex; flex-direction:column; gap:1.1rem;
  max-width:820px; width:100%; margin:0 auto;
  position:relative; z-index:1;
}

.msg { display:flex; gap:12px; max-width:86%; animation:fadeUp 0.3s ease; }
.msg.user { align-self:flex-end; flex-direction:row-reverse; }
.msg.ai   { align-self:flex-start; }

.mav {
  width:34px; height:34px; border-radius:10px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:0.95rem; margin-top:2px;
}
.msg.ai .mav  { background:linear-gradient(135deg,rgba(124,58,237,0.2),rgba(34,211,238,0.1)); border:1px solid rgba(168,85,247,0.25); }
.msg.user .mav{ background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); }

.mbub { padding:12px 16px; border-radius:16px; font-size:0.9rem; line-height:1.75; }
.msg.ai .mbub {
  background:rgba(255,255,255,0.035);
  backdrop-filter:blur(20px);
  border:1px solid var(--border);
  border-bottom-left-radius:4px;
}
.msg.user .mbub {
  background:linear-gradient(135deg,rgba(124,58,237,0.15),rgba(168,85,247,0.08));
  border:1px solid rgba(168,85,247,0.2);
  border-bottom-right-radius:4px;
}
.mtime { font-size:0.67rem; color:var(--muted); margin-top:5px; }
.msg.user .mtime { text-align:right; }

/* AI THINK BLOCK */
.think-block {
  font-size:0.78rem; color:var(--cyan);
  background:rgba(34,211,238,0.05); border:1px solid rgba(34,211,238,0.12);
  border-radius:8px; padding:8px 12px; margin-bottom:8px;
  font-style:italic; display:flex; align-items:flex-start; gap:6px;
  line-height:1.6;
}
.think-block::before { content:'💭'; flex-shrink:0; margin-top:1px; }

/* TYPING */
.typing { display:flex; gap:5px; padding:12px 16px; align-items:center; }
.typing span {
  width:6px; height:6px; border-radius:50%; background:var(--p1);
  box-shadow:0 0 6px var(--p1);
  animation:bounce 1.2s infinite;
}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}

/* WELCOME */
.welcome {
  text-align:center; padding:3.5rem 1rem;
  display:flex; flex-direction:column; align-items:center; gap:1rem;
}
.w-icon {
  width:80px; height:80px; border-radius:22px;
  background:linear-gradient(135deg,rgba(124,58,237,0.2),rgba(34,211,238,0.1));
  border:1px solid rgba(168,85,247,0.25); display:flex; align-items:center;
  justify-content:center; font-size:2.2rem;
  box-shadow:0 0 50px rgba(168,85,247,0.15), 0 0 80px rgba(34,211,238,0.08);
  animation:ringPulse 3s ease-in-out infinite;
}
.welcome h2 { font-family:'Syne',sans-serif; font-size:1.5rem; font-weight:800; }
.welcome p { color:var(--muted); font-size:0.88rem; line-height:1.75; max-width:360px; }
.ai-features {
  display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:0.5rem;
}
.ai-feat {
  background:rgba(168,85,247,0.06); border:1px solid rgba(168,85,247,0.15);
  border-radius:8px; padding:6px 12px; font-size:0.76rem; color:var(--muted);
  display:flex; align-items:center; gap:5px;
}

/* SUGGESTIONS */
.sugs {
  padding:0 2rem 0.75rem; max-width:820px; margin:0 auto; width:100%;
  display:flex; flex-wrap:wrap; gap:8px; position:relative; z-index:1;
}
.sug {
  background:rgba(168,85,247,0.05); border:1px solid rgba(168,85,247,0.14);
  color:var(--muted); padding:7px 14px; border-radius:999px;
  font-size:0.78rem; cursor:pointer; font-family:'Space Grotesk',sans-serif;
  transition:all 0.2s; white-space:nowrap;
}
.sug:hover { border-color:rgba(168,85,247,0.4); color:var(--p3); background:rgba(168,85,247,0.1); transform:translateY(-1px); }

/* INPUT */
.input-wrap {
  padding:0.85rem 2rem 1.2rem; max-width:820px; margin:0 auto; width:100%;
  position:relative; z-index:1;
}
.input-box {
  display:flex; gap:10px; align-items:flex-end;
  background:rgba(255,255,255,0.035);
  backdrop-filter:blur(28px) saturate(2);
  border:1px solid var(--border); border-radius:18px;
  padding:10px 10px 10px 16px;
  transition:border-color 0.2s, box-shadow 0.2s;
}
.input-box:focus-within { border-color:rgba(168,85,247,0.35); box-shadow:0 0 0 3px rgba(168,85,247,0.06); }
.msgin {
  flex:1; background:transparent; border:none;
  color:var(--text); font-size:0.9rem; font-family:'Space Grotesk',sans-serif;
  outline:none; resize:none; max-height:120px; line-height:1.6;
}
.msgin::placeholder { color:var(--muted); }
.send-btn {
  width:38px; height:38px; border-radius:11px; flex-shrink:0;
  background:linear-gradient(135deg,var(--p2),var(--p1));
  border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:all 0.2s; box-shadow:0 4px 14px rgba(124,58,237,0.35);
}
.send-btn:hover { transform:scale(1.07); box-shadow:0 6px 22px rgba(168,85,247,0.5); }
.send-btn:disabled { opacity:0.4; cursor:not-allowed; transform:none; }
.send-btn svg { width:16px; height:16px; fill:#fff; }
.clr {
  background:none; border:1px solid var(--border); color:var(--muted);
  padding:5px 12px; border-radius:8px; font-size:0.76rem;
  cursor:pointer; font-family:'Space Grotesk',sans-serif; transition:all 0.2s;
}
.clr:hover { border-color:var(--p1); color:var(--p3); }

/* MODE SELECTOR */
.mode-bar {
  display:flex; gap:6px; padding:10px 2rem 0; max-width:820px; margin:0 auto; width:100%;
  position:relative; z-index:1;
}
.mode-btn {
  padding:5px 14px; border-radius:8px; font-size:0.76rem; font-weight:600;
  cursor:pointer; font-family:'Space Grotesk',sans-serif; transition:all 0.2s;
  border:1px solid var(--border); color:var(--muted); background:none;
}
.mode-btn.active { background:rgba(168,85,247,0.1); border-color:rgba(168,85,247,0.3); color:var(--p3); }
.mode-btn:hover:not(.active) { border-color:rgba(168,85,247,0.2); color:var(--text); }
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<nav class="topnav">
  <a href="index.html" class="logo"><div class="logo-ring">⚡</div><span>SAVE</span>ONE</a>
  <div class="nav-links">
    <a href="index.html">Tekshirish</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="ai-assistant.html" class="active">AI Chat</a>
    <a href="call-protection.html">Himoya</a>
    <a href="education.html">Ta'lim</a>
  </div>
  <div class="nav-right">
    <div id="navUser" style="margin-right:8px"></div>
    <button class="clr" onclick="clearChat()">Tozalash</button>
  </div>
</nav>

<div class="chat-wrap">
  <!-- MODE BAR -->
  <div class="mode-bar">
    <button class="mode-btn active" onclick="setMode('security',this)">🛡️ Xavfsizlik</button>
    <button class="mode-btn" onclick="setMode('analyze',this)">🔍 Tahlil</button>
    <button class="mode-btn" onclick="setMode('guide',this)">📖 Qo'llanma</button>
    <button class="mode-btn" onclick="setMode('navigate',this)">🧭 Navigator</button>
  </div>

  <!-- MESSAGES -->
  <div class="msgs" id="msgs">
    <div class="welcome">
      <div class="w-icon">🤖</div>
      <h2>SAVEONE AI</h2>
      <p>Xavfsizlik maslahat, raqam tahlil, sahifalar bo'ylab yo'l ko'rsatish — hammasiga tayyor.</p>
      <div class="ai-features">
        <div class="ai-feat">💭 AI o'ylaydi</div>
        <div class="ai-feat">🧭 Saytni boshqaradi</div>
        <div class="ai-feat">🛡️ Himoya maslahat</div>
        <div class="ai-feat">🔍 Raqam tahlil</div>
      </div>
    </div>
  </div>

  <!-- SUGGESTIONS -->
  <div class="sugs" id="sugs">
    <button class="sug" onclick="sendSug(this)">Bank OTP so'rab qo'ng'iroq qildi</button>
    <button class="sug" onclick="sendSug(this)">Phishing SMS qanday aniqlanadi?</button>
    <button class="sug" onclick="sendSug(this)">+7 raqam xavflimi?</button>
    <button class="sug" onclick="sendSug(this)">Dashboard ga o'ting</button>
    <button class="sug" onclick="sendSug(this)">Parolimni qanday himoya qilaman?</button>
    <button class="sug" onclick="sendSug(this)">Ta'lim markaziga o'ting</button>
  </div>

  <!-- INPUT -->
  <div class="input-wrap">
    <div class="input-box">
      <textarea class="msgin" id="msgin"
        placeholder="Savol yozing yoki buyruq bering... (Enter = yuborish, Shift+Enter = yangi qator)"
        rows="1"></textarea>
      <button class="send-btn" id="sendbtn" onclick="send()">
        <svg viewBox="0 0 24 24"><path d="M2 21L23 12 2 3V10L17 12 2 14V21Z"/></svg>
      </button>
    </div>
  </div>
</div>

<script src="security.js"></script>
<script src="auth.js"></script>
<script src="ai-navigator.js"></script>
<script>
const MAX_MSG_LEN = 2000;

// Rejimlar
const MODES = {
  security: {
    name:'Xavfsizlik',
    system:`Sen SAVEONE xavfsizlik AI yordamchisisan. O'zbek tilida javob ber.
Har javobingni JSON formatida qat'iy ber:
{
  "think": "ichki fikrlash jarayoni (2-4 jumlat, o'z-o'zingcha mulohaza)",
  "reply": "foydalanuvchiga javob (markdown: **bold**, *italic*, raqamli ro'yxat)",
  "navigate": null | "index" | "dashboard" | "ai" | "himoya" | "talim" | "kirish",
  "risk_level": null | "LOW" | "MEDIUM" | "HIGH"
}
Mutaxassislik: telefon firibgarligi, scam, phishing, social engineering, OTP himoya.
Har doim aniq, amaliy maslahat ber. Ro'yxat va misollar ishlatasan.`
  },
  analyze: {
    name:'Tahlil',
    system:`Sen raqam va havolalarni tahlil qiluvchi SAVEONE AI sisan. O'zbek tilida javob ber.
JSON formatida:
{
  "think": "tahlil jarayoni",
  "reply": "batafsil tahlil natijasi",
  "navigate": null | sahifa nomi,
  "risk_level": "LOW" | "MEDIUM" | "HIGH" | null
}`
  },
  guide: {
    name:"Qo'llanma",
    system:`Sen SAVEONE foydalanuvchi yo'riqnomasi AI sisan. O'zbek tilida javob ber.
JSON: { "think": "...", "reply": "qadamma-qadam yo'riqnoma", "navigate": null | sahifa, "risk_level": null }`
  },
  navigate: {
    name:'Navigator',
    system:`Sen SAVEONE AI navigatorisan. Sahifalar: index, dashboard, ai, himoya, talim, kirish.
O'zbek tilida javob ber. JSON: { "think": "navigatsiya sababi", "reply": "qisqa javob", "navigate": "sahifa nomi", "risk_level": null }`
  }
};

let currentMode = 'security';
let history = [];

function setMode(mode, btn) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function getTime() {
  return new Date().toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit'});
}

function addMsg(role, text, thinkText) {
  const msgs = document.getElementById('msgs');
  const w = msgs.querySelector('.welcome'); if(w) w.remove();
  const d = document.createElement('div');
  d.className = `msg ${role}`;

  // Avval HTML escape, keyin faqat ruxsat etilgan markdown teglari
  const formatted = escapeHtml(text)
    .replace(/\n/g,'<br>')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.*?)\*/g,'<em>$1</em>')
    .replace(/^(\d+\.) /gm,'<br>$1 ');

  let thinkHtml = '';
  if (thinkText && role === 'ai') {
    const think = escapeHtml(String(thinkText).substring(0,120));
    thinkHtml = `<div class="think-block">${think}${String(thinkText).length>120?'...':''}</div>`;
  }

  d.innerHTML = `
    <div class="mav">${role==='ai'?'🛡️':'👤'}</div>
    <div>
      ${thinkHtml}
      <div class="mbub">${formatted}</div>
      <div class="mtime">${getTime()}</div>
    </div>`;
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
}

function showTyping() {
  const msgs = document.getElementById('msgs');
  const d = document.createElement('div');
  d.className='msg ai'; d.id='typing';
  d.innerHTML=`<div class="mav">🛡️</div>
    <div>
      <div class="think-block" style="font-size:0.75rem">💭 Tahlil qilyapman...</div>
      <div class="mbub"><div class="typing"><span></span><span></span><span></span></div></div>
    </div>`;
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
}
function hideTyping() { const t=document.getElementById('typing'); if(t) t.remove(); }

async function send() {
  const inp = document.getElementById('msgin');
  const text = inp.value.trim().slice(0, MAX_MSG_LEN);
  if (!text) return;

  document.getElementById('sugs').style.display = 'none';
  addMsg('user', text);
  history.push({ role:'user', parts:[{ text }] });
  inp.value = ''; inp.style.height = 'auto';
  document.getElementById('sendbtn').disabled = true;
  showTyping();

  try {
    const modeConfig = MODES[currentMode];
    const contents = history.slice(-8); // oxirgi 8 ta

    const { res, data } = await geminiRequest('gemini-2.0-flash-thinking-exp', {
      system_instruction:{ parts:[{ text: modeConfig.system }] },
      contents,
      generationConfig:{ temperature:0.75, maxOutputTokens:600 }
    });

    if (!res.ok) {
      // Fallback: oddiy model
      return await sendFallback(text, modeConfig.system);
    }

    const rawText = data?.candidates?.[0]?.content?.parts?.map(p=>p.text).join('') || '{}';
    let parsed;
    try {
      const jsonMatch = rawText.match(/\{[\s\S]*\}/);
      parsed = jsonMatch ? JSON.parse(jsonMatch[0]) : { think:'', reply: rawText, navigate:null };
    } catch {
      parsed = { think:'', reply: rawText, navigate:null };
    }

    history.push({ role:'model', parts:[{ text: rawText }] });

    hideTyping();
    addMsg('ai', parsed.reply || 'Tushundim!', parsed.think);

    // Navigatsiya
    if (typeof parsed.navigate === 'string') {
      setTimeout(() => {
        addMsg('ai', `▶️ ${parsed.navigate} sahifasiga o'tyapman...`);
        setTimeout(() => AINavi.navigate(parsed.navigate), 800);
      }, 800);
    }

  } catch(e) {
    hideTyping();
    await sendFallback(text, MODES[currentMode].system);
  }

  document.getElementById('sendbtn').disabled = false;
}

// Fallback: gemini-2.0-flash (thinking modeli ishlamasa)
async function sendFallback(text, systemPrompt) {
  try {
    const { data } = await geminiRequest('gemini-2.0-flash', {
      system_instruction:{ parts:[{ text: systemPrompt }] },
      contents: history.slice(-6),
      generationConfig:{ temperature:0.7, maxOutputTokens:500, responseMimeType:'application/json' }
    });
    const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
    let parsed;
    try { parsed = JSON.parse(rawText); }
    catch { parsed = { think:'', reply: rawText }; }
    history.push({ role:'model', parts:[{ text: rawText }] });
    hideTyping();
    addMsg('ai', parsed.reply || 'Tushundim!', parsed.think);
    if (typeof parsed.navigate === 'string') setTimeout(() => AINavi.navigate(parsed.navigate), 1000);
  } catch(e) {
    hideTyping();
    addMsg('ai','❌ Ulanish muammosi. Internetni tekshiring yoki biroz keyin urinib ko\'ring.');
  }
}

function sendSug(btn) {
  document.getElementById('msgin').value = btn.textContent;
  send();
}

function clearChat() {
  history = [];
  document.getElementById('msgs').innerHTML = `
    <div class="welcome">
      <div class="w-icon">🤖</div>
      <h2>SAVEONE AI</h2>
      <p>Suhbat tozalandi. Yangi savol bering!</p>
    </div>`;
  document.getElementById('sugs').style.display = 'flex';
}

const inp = document.getElementById('msgin');
inp.addEventListener('input', () => { inp.style.height='auto'; inp.style.height=Math.min(inp.scrollHeight,120)+'px'; });
inp.addEventListener('keydown', e => { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();} });
</script>
</body>
</html>
